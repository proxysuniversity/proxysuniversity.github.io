<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #0f0f0f;
  background: white;
}

button { font-family: inherit; cursor: pointer; }

header {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 35px;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  background: white;
  z-index: 10;
}

.logo { width: 115px; }

.search {
  display: flex;
  width: 500px;
  max-width: 55%;
  margin: auto;
}

.search input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ccc;
  border-radius: 25px 0 0 25px;
  padding: 12px 18px;
  font-size: 15px;
  outline: none;
}

.search button {
  width: 65px;
  border: 1px solid #ccc;
  border-left: none;
  border-radius: 0 25px 25px 0;
  background: #f5f5f5;
}

svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
}

.sidebar {
  position: fixed;
  top: 64px;
  left: 0;
  width: 210px;
  height: calc(100vh - 64px);
  padding: 15px 12px;
  border-right: 1px solid #eee;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 13px 12px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

.nav-item:hover,
.nav-item.active { background: #f0f0f0; }

main {
  margin-left: 210px;
  padding: 30px;
}

.video-container { max-width: 1050px; }

.player {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.player-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 40px 15px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.9));
  color: white;
  opacity: 0;
  transition: opacity .2s;
}

.player:hover .player-controls,
.player.paused .player-controls { opacity: 1; }

.progress {
  width: 100%;
  height: 4px;
  accent-color: #f00;
  cursor: pointer;
  display: block;
  margin-bottom: 10px;
}

.controls-row {
  display: flex;
  align-items: center;
  gap: 13px;
}

.control {
  display: grid;
  place-items: center;
  border: 0;
  padding: 3px;
  background: transparent;
  color: white;
}

.control svg { width: 23px; height: 23px; }
.control:hover { opacity: .7; }

.time {
  font-size: 12px;
  white-space: nowrap;
}

.volume {
  width: 70px;
  accent-color: white;
}

.spacer { flex: 1; }

.settings-menu {
  display: none;
  position: absolute;
  bottom: 65px;
  right: 48px;
  width: 170px;
  background: #222;
  border-radius: 9px;
  padding: 10px;
}

.settings-menu.show { display: block; }

.settings-menu button {
  display: block;
  width: 100%;
  padding: 10px;
  background: none;
  border: 0;
  color: white;
  text-align: left;
}

.settings-menu button:hover { background: #444; }

h1 {
  font-size: 21px;
  margin: 18px 0;
}

.channel-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.avatar {
  width: 43px;
  height: 43px;
  background: #e62117;
  color: white;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.channel-info small {
  display: block;
  color: #777;
  margin-top: 4px;
}

.subscribe {
  background: #0f0f0f;
  color: white;
  border: 0;
  border-radius: 25px;
  padding: 12px 18px;
  font-weight: bold;
}

.actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.action {
  border: 0;
  border-radius: 25px;
  padding: 10px 15px;
  background: #f2f2f2;
  display: flex;
  align-items: center;
  gap: 8px;
}

.action:hover { background: #e5e5e5; }
.action svg { width: 20px; height: 20px; }

.description {
  margin-top: 22px;
  background: #f2f2f2;
  padding: 17px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}

/* Video list */

.video-list-section {
  max-width: 1050px;
  margin-top: 35px;
}

.video-list-section h2 {
  font-size: 20px;
  margin-bottom: 18px;
}

.video-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
}

.video-card {
  cursor: pointer;
  min-width: 0;
}

.video-thumbnail {
  aspect-ratio: 16 / 9;
  background: #e8e8e8;
  border-radius: 11px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  font-size: 13px;
}

.video-thumbnail video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-card h3 {
  font-size: 15px;
  margin: 10px 0 5px;
}

.video-card p {
  font-size: 13px;
  color: #777;
  margin: 0;
}

.video-card:hover h3 {
  color: #555;
}

.video-card.selected .video-thumbnail {
  outline: 2px solid #cc0000;
}

@media(max-width: 750px) {
  .sidebar { display: none; }
  main { margin-left: 0; padding: 18px 12px; }
  header { padding: 0 12px; gap: 15px; }
  .logo { width: 90px; }
  .search { width: 100%; max-width: none; }
  .actions { margin-left: 0; }
}
</style>
</head>

<body>

<header>
  <img class="logo"
  src="https://proxysuniversity.github.io/u2belogo.png"
  alt="YouTube">

  <form class="search" id="searchForm">
    <input id="searchInput" type="search" placeholder="Search">
    <button aria-label="Search">
      <svg viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8"/>
        <path d="m16 16 5 5"/>
      </svg>
    </button>
  </form>
</header>

<nav class="sidebar">

  <div class="nav-item active">
    <svg viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10H3z"/>
      <path d="M9 20v-7h6v7"/>
    </svg>
    Home
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="4"/>
      <path d="m10 8 5 4-5 4z"/>
    </svg>
    Shorts
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M3 7h18v13H3z"/>
      <path d="M7 4h14M5 2h14"/>
      <path d="m10 11 5 3-5 3z"/>
    </svg>
    Subscriptions
  </div>

  <hr style="border:0;border-top:1px solid #eee">

  <div class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M9 5h12M9 12h12M9 19h12"/>
      <path d="M3 5h.01M3 12h.01M3 19h.01"/>
    </svg>
    History
  </div>

  <div class="nav-item">
    <svg viewBox="0 0 24 24">
      <path d="M4 4h16v16H4z"/>
      <path d="m9 9 6 3-6 3z"/>
    </svg>
    Liked videos
  </div>

</nav>

<main>
<div class="video-container">

  <div class="player paused" id="player">

    <video id="video" playsinline preload="metadata">
      <source id="videoSource" src="https://proxysuniversity.github.io/no,%20no%20no%20no%20DON'T%20DO%20THAT!.mp4" type="video/mp4">
    </video>

    <div class="player-controls">

      <input class="progress" id="progress"
      type="range" min="0" max="100" value="0" step=".1">

      <div class="controls-row">

        <button class="control" id="play" aria-label="Play">
          <svg viewBox="0 0 24 24" id="playIcon">
            <path d="m8 5 12 7-12 7z" fill="white" stroke="none"/>
          </svg>
        </button>

        <button class="control" id="mute" aria-label="Mute">
          <svg viewBox="0 0 24 24">
            <path d="M4 10v4h4l5 4V6l-5 4z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/>
            <path d="M18 6a9 9 0 0 1 0 12"/>
          </svg>
        </button>

        <input class="volume" id="volume"
        type="range" min="0" max="1" step=".05" value="1">

        <span class="time" id="time">0:00 / 0:00</span>

        <div class="spacer"></div>

        <button class="control" id="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </button>

        <button class="control" id="fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>
          </svg>
        </button>

      </div>

      <div class="settings-menu" id="settingsMenu">
        <strong>Playback speed</strong>
        <button data-speed=".5">0.5x</button>
        <button data-speed=".75">0.75x</button>
        <button data-speed="1">Normal</button>
        <button data-speed="1.25">1.25x</button>
        <button data-speed="1.5">1.5x</button>
        <button data-speed="2">2x</button>
      </div>

    </div>
  </div>

  <h1 id="videoTitle">NO NO NO NO DON'T DO THAT!</h1>

  <div class="channel-row">
    <div class="avatar">Y</div>

    <div class="channel-info">
      <strong>YouTube Channel</strong>
      <small>Video creator</small>
    </div>

    <button class="subscribe" id="subscribe">
      Subscribe
    </button>

    <div class="actions">

      <button class="action" id="like">
        <svg viewBox="0 0 24 24">
          <path d="M7 10v11H4V10h3zM7 10l5-7c2 0 3 2 2 4l-1 3h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 2H7"/>
        </svg>
        <span>0</span>
      </button>

      <button class="action" id="share">
        <svg viewBox="0 0 24 24">
          <path d="M12 15V3m-5 5 5-5 5 5"/>
          <path d="M5 12v8h14v-8"/>
        </svg>
        Share
      </button>

    </div>
  </div>

  <div class="description">
    <strong>Video description</strong>
    <br>
    Watch the video above. Thanks for viewing!
  </div>

</div>

<section class="video-list-section">
  <h2>Videos</h2>
  <div class="video-list" id="videoList"></div>
</section>

</main>

<script>
const video = document.getElementById("video");
const videoSource = document.getElementById("videoSource");
const player = document.getElementById("player");
const play = document.getElementById("play");
const playIcon = document.getElementById("playIcon");
const progress = document.getElementById("progress");
const time = document.getElementById("time");
const volume = document.getElementById("volume");
const mute = document.getElementById("mute");
const menu = document.getElementById("settingsMenu");
const videoTitle = document.getElementById("videoTitle");
const videoList = document.getElementById("videoList");

const videos = [
  {
    title: "NO NO NO NO DON'T DO THAT!",
    url: "https://proxysuniversity.github.io/no,%20no%20no%20no%20DON'T%20DO%20THAT!.mp4",
    type: "video/mp4"
  },
  {
    title: "Netflix",
    url: "https://cineosweb.github.io/Netflix.mp4",
    type: "video/mp4"
  },
  {
    title: "Boot",
    url: "https://cineosweb.github.io/Videos/Boot.mp4",
    type: "video/mp4"
  },
  {
    title: "The Pain and Sweat",
    url: "https://proxysuniversity.github.io/thepainandSWEAToutintothissht.webm",
    type: "video/webm"
  }
];

function renderVideos(list = videos) {
  videoList.innerHTML = "";

  list.forEach(item => {
    const card = document.createElement("div");
    card.className = "video-card";

    const thumbnail = document.createElement("div");
    thumbnail.className = "video-thumbnail";

    const preview = document.createElement("video");
    preview.src = item.url;
    preview.preload = "metadata";
    preview.muted = true;
    preview.playsInline = true;

    const title = document.createElement("h3");
    title.textContent = item.title;

    const channel = document.createElement("p");
    channel.textContent = "YouTube Channel";

    thumbnail.appendChild(preview);
    card.append(thumbnail, title, channel);

    card.onclick = () => loadVideo(item);

    videoList.appendChild(card);
  });

  updateSelectedCard();
}

function loadVideo(item) {
  video.pause();

  videoTitle.textContent = item.title;
  videoSource.src = item.url;
  videoSource.type = item.type;

  video.load();
  progress.value = 0;
  time.textContent = "0:00 / 0:00";

  player.classList.add("paused");

  video.play().catch(() => {
    player.classList.add("paused");
  });

  updateSelectedCard();
}

function updateSelectedCard() {
  document.querySelectorAll(".video-card").forEach(card => {
    card.classList.remove("selected");
    if (card.querySelector("h3")?.textContent === videoTitle.textContent) {
      card.classList.add("selected");
    }
  });
}

function icon(path) {
  playIcon.innerHTML = path;
}

function formatTime(s) {
  if (!Number.isFinite(s)) return "0:00";
  return Math.floor(s / 60) + ":" +
    String(Math.floor(s % 60)).padStart(2, "0");
}

function togglePlay() {
  if (video.paused) video.play();
  else video.pause();
}

play.onclick = togglePlay;
video.onclick = togglePlay;

video.onplay = () => {
  player.classList.remove("paused");
  play.setAttribute("aria-label", "Pause");
  icon('<path d="M7 5h4v14H7zM15 5h4v14h-4z" fill="white" stroke="none"/>');
};

video.onpause = () => {
  player.classList.add("paused");
  play.setAttribute("aria-label", "Play");
  icon('<path d="m8 5 12 7-12 7z" fill="white" stroke="none"/>');
};

video.ontimeupdate = () => {
  if (video.duration) {
    progress.value = video.currentTime / video.duration * 100;
  }

  time.textContent =
    formatTime(video.currentTime) + " / " +
    formatTime(video.duration);
};

progress.oninput = () => {
  if (video.duration) {
    video.currentTime = progress.value / 100 * video.duration;
  }
};

volume.oninput = () => {
  video.volume = volume.value;
  video.muted = false;
};

mute.onclick = () => {
  video.muted = !video.muted;
};

video.onvolumechange = () => {
  mute.style.opacity = video.muted || video.volume === 0 ? ".5" : "1";
};

document.getElementById("fullscreen").onclick = () => {
  if (!document.fullscreenElement) {
    player.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
};

document.getElementById("settings").onclick = () => {
  menu.classList.toggle("show");
};

menu.querySelectorAll("button").forEach(button => {
  button.onclick = () => {
    video.playbackRate = Number(button.dataset.speed);
    menu.classList.remove("show");
  };
});

document.getElementById("subscribe").onclick = function() {
  this.textContent =
    this.textContent === "Subscribe"
    ? "Subscribed" : "Subscribe";
};

let liked = false;

document.getElementById("like").onclick = function() {
  liked = !liked;
  this.querySelector("span").textContent = liked ? "1" : "0";
};

document.getElementById("share").onclick = async function() {
  try {
    await navigator.clipboard.writeText(location.href);
    this.lastChild.textContent = "Copied!";
    setTimeout(() => this.lastChild.textContent = "Share", 1500);
  } catch {
    alert("Unable to copy link.");
  }
};

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();

  const query = document.getElementById("searchInput").value.toLowerCase();

  const filtered = videos.filter(item =>
    item.title.toLowerCase().includes(query)
  );

  renderVideos(filtered);
});

renderVideos();
</script>

</body>
</html>
