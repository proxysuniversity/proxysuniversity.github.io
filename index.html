<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Blocked</title>
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #111;
        }

        body {
            margin: 20px;
        }

        #site {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }

        body.ready #site {
            opacity: 1;
            visibility: visible;
        }

        #blockedScreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            background: #000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #blockedScreen img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
        }

        #blockedScreen.fade {
            opacity: 0;
            pointer-events: none;
        }

        body.locked {
            overflow: hidden;
        }

        .title-image {
            max-width: 500px;
            max-height: 150px;
            width: auto;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }

        .website-image {
            max-width: 300px;
            max-height: 100px;
            width: auto;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .website {
            margin-bottom: 25px;
        }

        .website h2 {
            margin: 0 0 5px 0;
        }

        .website p {
            margin: 4px 0;
        }

        .website a {
            color: #0000ee;
        }
    </style>
</head>

<body class="locked">

    <div id="blockedScreen">
        <img src="blocked.png" alt="Page Blocked by School Admin">
    </div>

    <main id="site">
        <div id="pageTitle"></div>
        <p id="randomMessage"></p>
        <div id="websiteList"></div>
    </main>

    <audio id="music" preload="auto"></audio>

    <script>
        const pageTitle = {
            text: "My Websites",
            image: "proxyuniversitylogo.png"
        };

        const randomMessages = [
            "f students are inventors",
            "I'm getting bored!",
            "message",
            "idk"
        ];

        document.getElementById("randomMessage").textContent =
            randomMessages[
                Math.floor(Math.random() * randomMessages.length)
            ];

        const websites = [
            {
                name: "Google",
                image: "",
                url: "https://www.google.com",
                description: "Google is a search engine that lets you find information on the web.",
                hide: false
            },
            {
                name: "YouTube",
                image: "",
                url: "https://www.youtube.com",
                description: "YouTube is a website for watching and sharing videos.",
                hide: false
            },
            {
                name: "GitHub",
                image: "",
                url: "https://github.com",
                description: "GitHub is a platform for hosting and collaborating on software projects.",
                hide: false
            },
            {
                name: "Wikipedia",
                image: "",
                url: "https://www.wikipedia.org",
                description: "Wikipedia is a free online encyclopedia.",
                hide: false
            },
            {
                name: "Reddit",
                image: "",
                url: "https://www.reddit.com",
                description: "Reddit is a collection of online communities where people discuss different topics.",
                hide: false
            },
            {
                name: "Discord",
                image: "",
                url: "https://discord.com",
                description: "Discord is a communication platform for communities and friends.",
                hide: false
            },
            {
                name: "Twitch",
                image: "",
                url: "https://www.twitch.tv",
                description: "Twitch is a platform for live streaming.",
                hide: false
            },
            {
                name: "Google Drive",
                image: "",
                url: "https://drive.google.com",
                description: "Google Drive is an online file storage service.",
                hide: false
            },
            {
                name: "Google Docs",
                image: "",
                url: "https://docs.google.com",
                description: "Google Docs lets you create and edit documents online.",
                hide: false
            },
            {
                name: "Steam",
                image: "",
                url: "https://store.steampowered.com",
                description: "Steam is a digital distribution platform for PC games.",
                hide: false
            },
            {
                name: "Spotify",
                image: "",
                url: "https://open.spotify.com",
                description: "Spotify is a music and audio streaming service.",
                hide: false
            },
            {
                name: "Canva",
                image: "",
                url: "https://www.canva.com",
                description: "Canva is an online graphic design platform.",
                hide: false
            },
            {
                name: "CodePen",
                image: "",
                url: "https://codepen.io",
                description: "CodePen is an online editor for HTML, CSS and JavaScript.",
                hide: false
            },
            {
                name: "Stack Overflow",
                image: "",
                url: "https://stackoverflow.com",
                description: "Stack Overflow is a question-and-answer site for programmers.",
                hide: false
            },
            {
                name: "Internet Archive",
                image: "",
                url: "https://archive.org",
                description: "The Internet Archive preserves websites, books, videos and other digital media.",
                hide: false
            }
        ];

        const titleElement = document.getElementById("pageTitle");

        if (pageTitle.image !== "") {
            titleElement.innerHTML = `
                <img
                    src="${pageTitle.image}"
                    alt="${pageTitle.text}"
                    class="title-image"
                >
            `;
        } else {
            titleElement.innerHTML = `
                <h1>${pageTitle.text}</h1>
            `;
        }

        const list = document.getElementById("websiteList");

        websites.forEach(site => {
            if (site.hide === true) return;

            const div = document.createElement("div");
            div.className = "website";

            let nameHTML;

            if (site.image !== "") {
                nameHTML = `
                    <img
                        src="${site.image}"
                        alt="${site.name}"
                        class="website-image"
                    >
                `;
            } else {
                nameHTML = `
                    <h2>${site.name}</h2>
                `;
            }

            div.innerHTML = `
                ${nameHTML}

                <p>
                    <a
                        href="${site.url}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${site.url}
                    </a>
                </p>

                <p>${site.description}</p>
            `;

            list.appendChild(div);
        });

        const songs = [
            "bgmusic01.mp3",
            "bgmusic02.mp3",
            "bgmusic03.mp3"
        ];

        const music = document.getElementById("music");

        let playlist = [];
        let currentSong = 0;

        function shuffle(array) {
            const shuffled = [...array];

            for (let i = shuffled.length - 1; i > 0; i--) {
                const random = Math.floor(
                    Math.random() * (i + 1)
                );

                [shuffled[i], shuffled[random]] =
                [shuffled[random], shuffled[i]];
            }

            return shuffled;
        }

        function playSong() {
            if (currentSong >= playlist.length) {
                return;
            }

            music.src = playlist[currentSong];

            music.play().catch(error => {
                console.log("Music could not start:", error);
            });
        }

        music.addEventListener("ended", function() {
            currentSong++;

            if (currentSong < playlist.length) {
                playSong();
            }
        });

        const blockedScreen =
            document.getElementById("blockedScreen");

        blockedScreen.addEventListener("click", function() {
            playlist = shuffle(songs);
            currentSong = 0;

            playSong();

            blockedScreen.classList.add("fade");

            document.body.classList.remove("locked");
            document.body.classList.add("ready");

            setTimeout(function() {
                blockedScreen.remove();
            }, 800);
        }, { once: true });
    </script>

</body>
</html>
