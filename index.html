<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Blocked</title>
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #111;
        }

        body {
            margin: 20px;
        }

        #site {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }

        body.ready #site {
            opacity: 1;
            visibility: visible;
        }

        #blockedScreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            background: #000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #blockedScreen img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
        }

        #blockedScreen.fade {
            opacity: 0;
            pointer-events: none;
        }

        body.locked {
            overflow: hidden;
        }

        .title-image {
            max-width: 500px;
            max-height: 150px;
            width: auto;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }

        .website-image {
            max-width: 300px;
            max-height: 100px;
            width: auto;
            height: auto;
            display: block;
            margin-bottom: 5px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .website {
            margin-bottom: 25px;
        }

        .website h2 {
            margin: 0 0 5px 0;
        }

        .website p {
            margin: 4px 0;
        }

        .website a {
            color: #0000ee;
        }
    </style>
</head>

<body class="locked">

    <div id="blockedScreen">
        <img src="blocked.png" alt="Page Blocked by School Admin">
    </div>

    <main id="site">

        <div id="pageTitle"></div>

        <p id="randomMessage"></p>

        <div id="websiteList"></div>

    </main>

    <audio id="music" preload="auto"></audio>

    <script>

        const pageTitle = {
            text: "My Websites",
            image: "proxyuniversitylogo.png"
        };


        const randomMessages = [

            "let me guess, you found this website on a piece of paper didn't you",

            "literally the best proxy research website ever",
            "GoGurdian got nothing on this, maybe...?",
            "i don't like writing these messages bro",
            "sudeys, i know you're there.",
            "imma just leave this website alone for a minute",
            "i found some random jersey club songs of youtube",
            "these songs are peak",
            "pro tip: the blocked thingy is fake just click and get started",
            "literally this website is peak bro",
            "if the website says (blocked.gogurdian.com) then it's actually blocked idk why tho."
        ];


        document.getElementById("randomMessage").textContent =
            randomMessages[
                Math.floor(Math.random() * randomMessages.length)
            ];


        const websites = [

            {
                name: "Google",
                image: "",
                url: "https://www.google.com/",
                description: "Search the web",
                hide: true
            },

            {
                name: "YouTube",
                image: "",
                url: "https://www.youtube.com/",
                description: "Watch videos",
                hide: true
            },

            {
                name: "GitHub",
                image: "",

                description: "Code hosting and development",
                hide: true
            },

            {
                name: "Wikipedia",

                description: "Free online encyclopedia",
                hide: true
            },

            {
                name: "Reddit",
                image: "",
                url: "https://www.reddit.com/",
                description: "Online communities",
                hide: true
            },

            {
                name: "Discord",
                image: "",
                url: "https://discord.com/",
                description: "Chat and communities",
                hide: true
            },

            {
                name: "Twitch",
                image: "",
                url: "https://www.twitch.tv/",
                description: "Live streaming",
                hide: true
            },

            {
                name: "Proxy's University Streaming",
                image: "",
                url: "https://example.com/",
                description: "Proxy's University Streaming",
                hide: false
            },

            {
                name: "Yuki OS",
                image: "",
                url: "https://yukios.netlify.app/",
                description: "YukiOS",
                hide: false
            },

            {
                name: "Chalkie",
                image: "",
                url: "https://lootline.xyz/",
                description: "Chalkie, Game Station",
                hide: false
            },

            {
                name: "Cine-OS",
                image: "",
                url: "https://cineosweb.github.io/",
                description: "CineOS",
                hide: false
            },

            {
                name: "Classroom 6x",
                image: "https://lh3.googleusercontent.com/sitesv/AG8ngQXmJT86KOtVvuy6hf04HyMA9PSwPUoz1D8ffZlMf0_48xUviptHcxumJdCK_BoAj6UWDFNNjah9wBGpJyMvzGuzNsW_6WMMcjvMw4FhWDBxEN99ZVkcJesiuDn0GwiikId3imlRlBpF-kpPXCFHY1lTfWyniAUnqdGhm2bkr-m-RxogxoWr7x5Hu9szgo7QXMm_qI-0t6TkEEc0bA4UAV3viFS0u6LiYZNzlKAsuKw=w1280",
                url: "https://sites.google.com/view/classroom6x/",
                description: "Classroom 6x",
                hide: false
            },

            {
                name: "MexiMath",
                image: "",
                url: "https://mexi.rest/",
                description: "MexiMath",
                hide: false
            },

            {
                name: "Frogies Arcade",
                image: "https://avatars.githubusercontent.com/u/115168315?v=4",
                url: "https://denisonisd.org/",
                description: "Frogies Arcade",
                hide: false
            },

            {
                name: "Frogies Arcade",
                image: "https://avatars.githubusercontent.com/u/115168315?v=4",
                url: "https://frog.hpsschools.org/",
                description: "Frogies Arcade",
                hide: false
            },

            {
                name: "Frogies Arcade",
                image: "https://avatars.githubusercontent.com/u/115168315?v=4",
                url: "https://xn--68ja2bjb6b6c1ea6n6586bf9xa0k0e3pze.xyz/",
                description: "Frogies Arcade",
                hide: false
            }

        ];


        const titleElement =
            document.getElementById("pageTitle");


        if (pageTitle.image !== "") {

            titleElement.innerHTML = `
                <img
                    src="${pageTitle.image}"
                    alt="${pageTitle.text}"
                    class="title-image"
                >
            `;

        } else {

            titleElement.innerHTML = `
                <h1>${pageTitle.text}</h1>
            `;

        }


        const list =
            document.getElementById("websiteList");


        websites.forEach(site => {

            if (site.hide === true) {
                return;
            }


            const div =
                document.createElement("div");

            div.className = "website";


            let nameHTML;


            if (site.image !== "") {

                nameHTML = `
                    <img
                        src="${site.image}"
                        alt="${site.name}"
                        class="website-image"
                    >
                `;

            } else {

                nameHTML = `
                    <h2>${site.name}</h2>
                `;

            }


            div.innerHTML = `
                ${nameHTML}

                <p>
                    <a
                        href="${site.url}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${site.url}
                    </a>
                </p>

                <p>${site.description}</p>
            `;


            list.appendChild(div);

        });


        const songs = [
            "bgmusic01.mp3",
            "bgmusic02.mp3",
            "bgmusic03.mp3"
        ];


        const music =
            document.getElementById("music");


        let playlist = [];
        let currentSong = 0;


        function shuffle(array) {

            const shuffled = [...array];


            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const random =
                    Math.floor(
                        Math.random() * (i + 1)
                    );


                [
                    shuffled[i],
                    shuffled[random]
                ] = [
                    shuffled[random],
                    shuffled[i]
                ];

            }


            return shuffled;

        }


        function playSong() {

            if (currentSong >= playlist.length) {
                return;
            }


            music.src =
                playlist[currentSong];


            music.play().catch(error => {

                console.log(
                    "Music could not start:",
                    error
                );

            });

        }


        music.addEventListener(
            "ended",
            function() {

                currentSong++;


                if (
                    currentSong <
                    playlist.length
                ) {

                    playSong();

                }

            }
        );


        const blockedScreen =
            document.getElementById(
                "blockedScreen"
            );


        blockedScreen.addEventListener(
            "click",
            function() {

                playlist =
                    shuffle(songs);

                currentSong = 0;


                playSong();


                blockedScreen.classList.add(
                    "fade"
                );


                document.body.classList.remove(
                    "locked"
                );


                document.body.classList.add(
                    "ready"
                );


                setTimeout(
                    function() {

                        blockedScreen.remove();

                    },
                    800
                );

            },
            {
                once: true
            }
        );

    </script>

</body>
</html>
