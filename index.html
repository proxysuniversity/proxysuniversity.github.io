            font-size: 13px;
            font-weight: 600;
            cursor: pointer;

        }

        .headerButton:hover {
            background: #000;
            color: #fff;
        }

        body.locked {
            overflow: hidden;
        }

        .logo-link {
            display: inline-block;
            text-decoration: none;
        }

        .website-image {

            border: 1px solid #000;

            document.getElementById("muteButton");

        let songsMuted = false;

        muteButton.addEventListener("click", function() {
            songsMuted = !songsMuted;
            music.muted = songsMuted;
            muteButton.textContent = songsMuted
                ? "Unmute Songs"
                : "Mute Songs";
        });


        let playlist = [];
        let currentSong = 0;


        function shuffle(array) {

            const shuffled = [...array];


            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const random =
                    Math.floor(
                        Math.random() * (i + 1)
                    );


                [
                    shuffled[i],
                    shuffled[random]
                ] = [
                    shuffled[random],
                    shuffled[i]
                ];

            }


            return shuffled;

        }


        function playSong() {

            if (currentSong >= playlist.length) {
                return;
            }


            music.src =
                playlist[currentSong];


            music.play().catch(error => {

                console.log(
                    "Music could not start:",
                    error
                );

            });

        }


        music.addEventListener(
            "ended",
            function() {

                currentSong++;


                if (currentSong >= playlist.length) {
                    currentSong = 0;
                }

                playSong();

            }
        );


        const blockedScreen =
            document.getElementById(
                "blockedScreen"
            );


        const videoURL =
            "https://proxysuniversity.github.io/no,%20no%20no%20no%20DON%27T%20DO%20THAT!.mp4";

        let blockedOpened = false;

        function fadeBlockedScreen() {
            if (blockedOpened) return;

            blockedOpened = true;
            blockedScreen.classList.add("fade");
            document.body.classList.remove("locked");
            document.body.classList.add("ready");

            setTimeout(function() {
                blockedScreen.style.display = "none";
            }, 800);
        }

        let blockedClickTimer = null;
        let blockedClickCount = 0;

        blockedScreen.addEventListener("click", function() {
            blockedClickCount++;

            if (blockedClickTimer) {
                clearTimeout(blockedClickTimer);
            }

            if (blockedClickCount >= 2) {
                window.location.href = videoURL;
                return;
            }

            blockedClickTimer = setTimeout(function() {
                blockedClickCount = 0;

                playlist = shuffle(songs);
                currentSong = 0;
                playSong();

                blockedScreen.classList.add("fade");
                document.body.classList.remove("locked");
                document.body.classList.add("ready");

                setTimeout(function() {
                    blockedScreen.remove();
                }, 800);
            }, 500);
        });

    </script>

</body>
</html>
